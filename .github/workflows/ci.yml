name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and API build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ARC_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$'; then
            echo "An env file is tracked by git"; exit 1
          fi
          if grep -rn "SERVICE_ROLE" src/; then
            echo "Service-role key referenced in browser code"; exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and typecheck (if the script exists)
        run: bun run --if-present check

      - name: API typecheck
        run: bunx tsc -p api/tsconfig.json --noEmit

      - name: Build
        run: bun run build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test
        run: forge test -vv